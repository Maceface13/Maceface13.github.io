      <!--
        Adding a post:
        1. Copy hello-world.html in this folder and give the copy a new file name.
        2. Change the title, date, and paragraphs in that new file.
        3. Copy an <li> below, paste it at the top of the list, and update the link (href), date, title, and summary.
           Leave the "Read more →" line as it is. The whole card is one link.
        Fuller steps are in the README at the project root.
      -->
      <div class="blog-intro">
        <img class="headshot headshot-thumb" src="../images/headshot.jpg" width="720" height="894" alt="Photo of Macey">

      </div>

      <ul class="post-list">
        <li>
          <a class="post-card" href="hello-world.html">
